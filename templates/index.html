<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Caleb - Guía de Salud Integral</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .main-content {
            flex-grow: 1; /* Permite que el contenido principal crezca */
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra verticalmente */
            align-items: center;
            width: 100%;
            padding: 20px;
        }
        .bot-message-container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }
        .bot-message {
            background-color: #f0f7f4;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 1.1em;
            color: #1a535c;
        }
        strong {
            color: #00796b;
        }
        /* Nueva sección para la entrada de texto (el pie de la app) */
        .chat-input-container {
            width: 100%;
            max-width: 600px;
            position: fixed; /* Lo fija al fondo de la página */
            bottom: 0;
            padding: 15px 20px;
            background-color: white;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: center;
        }
        .chat-input-container input {
            padding: 10px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            margin-right: 10px;
        }
        .chat-input-container button {
            padding: 10px 15px;
            border: none;
            background-color: #00796b;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="main-content">
    <div class="bot-message-container">
        <div class="bot-message" id="welcome-message">
            </div>
    </div>
    
    <div id="messages-display">
        </div>

</div>

<div class="chat-input-container">
    <input type="text" id="chat-input" placeholder="Escribe HOLA para ver el menú...">
    <button onclick="sendMessage()">Enviar</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Mensaje de bienvenida profesional
        const welcomeText = "👋 **¡Saludos! Bienvenido/a al Ministerio de Salud Adventista.** Soy el Dr. Caleb, tu guía. \n\n" + 
                            "Para obtener nuestro menú de servicios e iniciar tu consulta clínica, \n" + 
                            "por favor, **escribe HOLA** y presiona Enviar.";

        const welcomeDiv = document.getElementById('welcome-message');
        
        function renderMarkdown(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        welcomeDiv.innerHTML = renderMarkdown(welcomeText);
    });

    // Esta función simularía el envío a tu ruta /chat
    function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value;
        if (!message.trim()) return;

        // Limpia la caja de texto
        input.value = '';

        // *** IMPORTANTE: IMPLEMENTACIÓN DE BACKEND ***
        // Este es el punto donde el JavaScript debería enviar el mensaje a tu ruta Flask /chat 
        // y mostrar la respuesta en #messages-display. 
        // Esto requiere más código JS y un formulario, pero la presentación ya está correcta.

        console.log("Mensaje enviado (simulado):", message);
    }
</script>

</body>
</html>
