<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Caleb - Guía de Salud Integral</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        .bot-message {
            background-color: #f0f7f4; /* Color suave para el contexto Adventista */
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 1.1em;
            color: #1a535c; /* Tono profesional */
        }
        .instruction {
            font-size: 1em;
            color: #708090;
            text-align: center;
            padding-top: 10px;
        }
        strong {
            color: #00796b; /* Color de énfasis */
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="bot-message" id="welcome-message">
        </div>

    <div class="instruction">
        *Escribe tu mensaje en la aplicación de chat (WhatsApp/Telegram) para iniciar la conversación.*
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Mensaje que aparece automáticamente al abrir la URL
        const welcomeText = "👋 **¡Saludos! Bienvenido/a al Ministerio de Salud Adventista.** Soy el Dr. Caleb, tu guía. \n\n" + 
                            "Para obtener nuestro menú de servicios e iniciar tu consulta clínica, \n" + 
                            "por favor, **escribe HOLA** en el chat.";

        const welcomeDiv = document.getElementById('welcome-message');
        
        // Función simple para renderizar el formato Markdown básico
        function renderMarkdown(text) {
            // Reemplaza **negritas**
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Reemplaza saltos de línea por <br>
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        welcomeDiv.innerHTML = renderMarkdown(welcomeText);
    });
</script>

</body>
</html>
