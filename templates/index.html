<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Caleb - Guía de Salud Integral</title>
    <style>
        /* BASE Y FUENTE */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fuente moderna */
            margin: 0; padding: 0; background-color: #f0f8ff; /* Azul claro suave, juvenil */
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        
        /* CONTENEDOR PRINCIPAL (se adapta al 100% en móviles) */
        .main-content { 
            flex-grow: 1; padding: 15px; width: 100%; max-width: 600px;
            display: flex; flex-direction: column; 
            padding-bottom: 90px; /* Espacio para el input fijo */
        }
        
        /* ESTILOS DE CHAT */
        #messages-display {
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        .bot-message-container { 
            width: 100%; background: #ffffff; 
            padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); 
            margin-bottom: 15px; 
        }
        .bot-message { 
            background-color: #e6f7ff; /* Tono más vibrante */
            padding: 12px; border-radius: 10px; 
            line-height: 1.6; font-size: 1em; 
            color: #004d40; /* Verde oscuro profesional */
            white-space: pre-wrap; 
            font-weight: 500; /* Peso de fuente juvenil */
        }
        
        /* MENSAJES DE CONVERSACIÓN */
        .user-message { 
            background-color: #d1e7ff; /* Azul claro de usuario */
            padding: 10px; border-radius: 18px 18px 2px 18px; /* Burbuja juvenil */
            margin: 8px 0; text-align: left; max-width: 85%;
            align-self: flex-end; /* Mover a la derecha */
        }
        .bot-response { 
            background-color: #e6f7ff; 
            padding: 10px; border-radius: 18px 18px 18px 2px; /* Burbuja juvenil */
            margin: 8px 0; text-align: left; white-space: pre-wrap; 
            max-width: 85%;
            align-self: flex-start; /* Mover a la izquierda */
        }
        
        strong { color: #00796b; } /* Color de énfasis profesional */

        /* CONTENEDOR DE INPUT FIJO (Adaptable) */
        .chat-input-container { 
            width: 100%; max-width: 600px; position: fixed; bottom: 0; 
            padding: 10px 15px; background-color: white; 
            box-shadow: 0 -3px 10px rgba(0, 0, 0, 0.1); 
            display: flex; align-items: center; 
            box-sizing: border-box; /* Asegura que el padding se incluya en el ancho */
        }
        .chat-input-container input { 
            padding: 12px; flex-grow: 1; border: 1px solid #ccc; 
            border-radius: 20px; /* Bordes redondeados juveniles */
            font-size: 1em; margin-right: 10px; 
        }
        .chat-input-container button { 
            padding: 10px 15px; border: none; 
            background-color: #00a884; /* Verde WhatsApp, juvenil y limpio */
            color: white; border-radius: 20px; 
            cursor: pointer; font-weight: bold; 
            transition: background-color 0.3s;
        }
        .chat-input-container button:hover {
            background-color: #00897b;
        }

    </style>
</head>
<body>

<div class="main-content">
    <div class="bot-message-container">
        <div class="bot-response" id="welcome-message" style="margin-top: 0; border-radius: 12px;">
            </div>
    </div>
    
    <div id="messages-display">
        </div>

</div>

<div class="chat-input-container">
    <input type="text" id="chat-input" placeholder="Escribe HOLA para ver el menú...">
    <button onclick="sendMessage()">Enviar</button>
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Mensaje de bienvenida profesional
        const welcomeText = "👋 **¡Saludos! Bienvenido/a al Ministerio de Salud Adventista.** Soy el Dr. Caleb, tu guía. \n\n" + 
                            "Para obtener nuestro menú de servicios e iniciar tu consulta clínica, \n" + 
                            "por favor, **escribe HOLA** y presiona Enviar.";

        const welcomeDiv = document.getElementById('welcome-message');
        
        function renderMarkdown(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        welcomeDiv.innerHTML = renderMarkdown(welcomeText);

        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    });
    
    // Función para añadir mensajes al DOM y forzar el scroll
    function displayMessage(sender, text) {
        const messagesDiv = document.getElementById('messages-display');
        const newMessage = document.createElement('div');
        newMessage.className = sender === 'user' ? 'user-message' : 'bot-response';
        
        function renderBotMarkdown(text) {
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return text.replace(/\n/g, '<br>');
        }
        
        newMessage.innerHTML = sender === 'user' ? text : renderBotMarkdown(text);
        messagesDiv.appendChild(newMessage);
        
        // CÓDIGO CLAVE PARA EL SCROLL
        window.scrollTo(0, document.body.scrollHeight);
    }

    // FUNCIÓN CRÍTICA QUE CONECTA EL FRONTEND CON LA RUTA DE FLASK
    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value;
        if (!message.trim()) return;

        displayMessage('user', message);
        input.value = '';

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ mensaje: message })
            });

            const data = await response.json();
            
            if (data.respuesta) {
                displayMessage('bot', data.respuesta);
            } else {
                displayMessage('bot', '⚠️ Error: No se recibió una respuesta válida del servidor.');
            }

        } catch (error) {
            console.error('Error al conectar con la API:', error);
            displayMessage('bot', '❌ Lo siento, la conexión falló. Intenta de nuevo más tarde.');
        }
    }
</script>

</body>
</html>
